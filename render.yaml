services:
  - type: web
    name: checklist-situacional-cme-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /opt/render/project/src/backend/data/cme_checklist.db
      - key: ALLOWED_ORIGINS
        sync: false
    disk:
      name: checklist-cme-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
